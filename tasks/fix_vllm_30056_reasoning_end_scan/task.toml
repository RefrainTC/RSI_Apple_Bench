schema_version = "1.2"

[task]
name = "rsi-apple-bench/fix_vllm_30056_reasoning_end_scan"
description = "Structured-output requests (a JSON schema) served with vLLM's qwen3 reasoning parser decode far more slowly than one RTX 4090 delivers. The load is 64 requests x 1024 random ids -> 512 greedy tokens in one call, each with a JSON schema and with the think tokens biased away so the request never leaves its reasoning phase; scored on the median rep wall time against the unmodified tree in interleaved pairs on the same GPU. Outputs must be bit-identical: token counts, resolved engine config, timed-rep digests and a 24-question pass where the model thinks and then answers under the grammar."
keywords = ["vllm", "optimization", "structured-output", "reasoning-parser", "xgrammar", "engine-core", "cpu-overhead", "offline"]

[environment]
gpus = 1
gpu_types = ["RTX 4090"]
allow_internet = false   # setup (package/RUN.md steps 2-4) downloads wheels, the dependency lock and the model; scoring runs offline

[metadata.rsi_apple_bench]
origin = "vLLM history"
upstream_pr = "https://github.com/vllm-project/vllm/pull/30056"
selected_from = "mined, batch 6 (candidate N1)"
package = "package/RUN.md"

[metadata.rsi_apple_bench.target]
repo = "https://github.com/vllm-project/vllm.git"
baseline_commit = "67475a6e81abea915857f82e6f10d80b03b842c9"
reference_fix_commit = "c72ea1072313b30fc8b4701697520fdd0b56fc35"
engine_version = "vLLM 0.11.2.dev690 (per-commit wheel), torch 2.9.0+cu128, triton 3.5.0, xgrammar 0.1.27, transformers 4.57.3, flashinfer 0.5.3, Python 3.10"

[metadata.rsi_apple_bench.model]
hf_model_id = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"

[metadata.rsi_apple_bench.scoring]
metric = "median rep wall time over 3 reps (64 structured-output requests x 1024 random ids -> 512 greedy tokens, reasoning never ends), parent / candidate; job speedup = median of 3 ABBA pairs"
reference_speedup = 1.79
band_pct = 3.0
aa_band_pct = 3.0
gate = "exact: output token counts, resolved vllm_config incl. structured_outputs_config (num_gpu_blocks ignored), timed-rep digests, and a 24-question pass (thinking on, JSON schema, 384 tokens with logprobs) identical to the same job's parent pass; one rerun allowed when exactly one timed rep of one run differs; in calibration, fix reps are judged against the majority parent digest per rep and up to 2 parent flips are reported, not gated"

[metadata.rsi_apple_bench.measured]
rtx4090 = { ref = 1.79, aa_max_pct = 2.54, jobs = 8, minutes_per_scoring = 8.6 }

[metadata.rsi_apple_bench.acceptance]
independent = "PASS-with-fixes (same server, median of 5 jobs 1.790; first fresh calibration fail:exact from one parent flip; calibration rule fixed 2026-11-25, GPU re-run pending); PASS on a second server (2-GPU, 0 flips in 123 reps)"
report = "docs/acceptance/batch6.md, docs/acceptance/batch5.md (second server)"
