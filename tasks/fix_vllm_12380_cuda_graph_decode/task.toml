schema_version = "1.2"

[task]
name = "rsi-apple-bench/fix_vllm_12380_cuda_graph_decode"
description = "Offline vLLM 0.6.6 (V0 engine, CUDA graphs on by default) generates batches of 8 short prompts x 128 greedy tokens on Llama-3-8B-Instruct-FP8, and each decode step costs far more than this GPU needs. Scored on the median wall time of 10 timed generate() calls, each on a new prompt set, against the unmodified tree in interleaved ABBA pairs on one RTX 4090. Outputs must be bit-identical to the parent's, and every model step's batch shape must match."
keywords = ["vllm", "regression", "decode", "cuda-graphs", "offline", "fp8", "cpu-launch-bound"]

[environment]
gpus = 1
gpu_types = ["RTX 4090"]
allow_internet = false   # setup (package/RUN.md steps 2-4) downloads wheels, CPython and the model; scoring runs offline

[metadata.rsi_apple_bench]
origin = "vLLM history"
upstream_pr = "https://github.com/vllm-project/vllm/pull/12380"
selected_from = "ISO-Bench list, screen batch 2 (written prior P = 0.45)"
package = "package/RUN.md"

[metadata.rsi_apple_bench.target]
repo = "https://github.com/vllm-project/vllm.git"
baseline_commit = "0e74d797ce8618fdb685126e0ff8576fb966e6ad"
reference_fix_commit = "6dd94dbe94c1820a1e224cba65efcf0befa97995"
engine_version = "vLLM 0.6.6.post2.dev364 (V0 engine, per-commit wheels), torch 2.5.1+cu124"

[metadata.rsi_apple_bench.model]
hf_model_id = "RedHatAI/Meta-Llama-3-8B-Instruct-FP8"
revision = "c5c6b5700a4178ef1fdae2ae37827382b90eb400"

[metadata.rsi_apple_bench.scoring]
metric = "median wall time of 10 timed generate() calls (batch 8, 32 random-token prompts, 128 greedy tokens, new prompts per call), parent / candidate; job speedup = median of 3 ABBA pairs"
reference_speedup = 1.507
band_pct = 1.1
aa_band_pct = 2.3
gate = "kernel, locked-file and protected-setting gate; bit-identical tokens and text on every scored request (tie <= 0.125 nats, 100 % exact); step trace (prefill/decode tokens per step) equal to the paired parent; settings readback; greedy logprob correctness run; GPU-busy witness; audit hook; integrity manifests"

[metadata.rsi_apple_bench.measured]
rtx4090 = { ref = 1.507, aa_max_pct = 2.3, jobs = 8, minutes_per_scoring = 8.7, note = "4 jobs on each of two 4090 servers; the 2-GPU server reads ~0.9 % lower" }

[metadata.rsi_apple_bench.acceptance]
independent = "PASS-with-fixes"
report = "docs/acceptance/batch2.md"
