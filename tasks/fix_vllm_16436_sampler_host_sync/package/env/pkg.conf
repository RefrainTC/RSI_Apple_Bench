# The authors' venvs held the bytecode (.pyc) of every module a run imports (written by earlier use), so their runs left
# the run copy of the venv unchanged. A freshly built venv has no .pyc for many modules; the `vllm serve` processes then
# write them into the run venv, the harness's venv guard reports `changed_by_run` and every scored pair is flagged
# `venv_changed` (verdict `integrity_fail`). Pre-compile the bytecode once, here, so the staged master already has it.
post_setup() {
  local role V r=0
  for role in $ROLES; do
    V=$ISO_ROOT/venvs/${PR}_$role
    "$V/bin/python3" -I -m compileall -q -j 8 "$V/lib/python3.10/site-packages" > "$T/compileall_$role.log" 2>&1 || true
    echo "$role bytecode compiled: $(find "$V" -name '*.pyc' | wc -l) .pyc files (the authors' venv: 4,781; failures for py2-only test files are expected)"
  done
  return $r
}
