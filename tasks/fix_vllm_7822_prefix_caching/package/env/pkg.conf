# vLLM 0.5.5 takes FlashAttention from the separate vllm-flash-attn package; without it vLLM silently falls back to
# xformers + a Triton prefix kernel (other numbers, other outputs). Check it is there and is the authors' build.
post_setup() {
  local role SP=lib/python3.10/site-packages r=0
  for role in $ROLES; do
    (cd "$ISO_ROOT/venvs/${PR}_$role/$SP" && find vllm_flash_attn vllm_flash_attn_2_cuda.cpython-310-x86_64-linux-gnu.so -type f ! -name '*.pyc' ! -path '*/__pycache__/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$T/fa_$role.sha256" 2>/dev/null
    if cmp -s "$T/fa_$role.sha256" "$ISO_ROOT/env/${PR}_${role}_flashattn.sha256"; then echo "$role vllm_flash_attn files: $(wc -l < "$T/fa_$role.sha256") hashes identical to the authors' venv"
    else echo "$role VLLM_FLASH_ATTN MISSING OR DIFFERENT"; r=1; fi
    "$ISO_ROOT/venvs/${PR}_$role/bin/python3" -I -c "import vllm_flash_attn; print('$role vllm_flash_attn import ok')" 2>&1 | tail -1
  done
  return $r
}
