# The task's "parent" venv is 13365_base = 13365_parent + numba 0.60.0 / llvmlite 0.43.0 copied from 13365_fix (the fix's
# own pins; the parent does not depend on numba, the human fix does). Recipe of the authors' ops_iso13365/setup_main.sh step 1.
post_setup() {
  local V=$ISO_ROOT/venvs SP=lib/python3.10/site-packages d
  rm -rf "$V/13365_base" "$V/13365_base.partial"; cp -a "$V/13365_parent" "$V/13365_base.partial" || return 1
  for d in numba numba-0.60.0.dist-info llvmlite llvmlite-0.43.0.dist-info llvmlite.libs; do
    cp -a "$V/13365_fix/$SP/$d" "$V/13365_base.partial/$SP/" || return 1; done
  mv "$V/13365_base.partial" "$V/13365_base" && date -Is > "$V/13365_base/.iso13365_built"
  VIRTUAL_ENV=$V/13365_base $UV pip freeze | grep -v -i -E '^vllm( |==|@)' > "$T/freeze_base.txt"
  if diff <(grep -v -i -E '^vllm( |==|@)' "$ISO_ROOT/env/13365_fix_freeze.txt") "$T/freeze_base.txt" > /dev/null; then echo "base freeze: parent + numba/llvmlite, as the authors' (fix freeze without vllm)"
  else echo "BASE FREEZE DIFFERS"; return 1; fi
  "$V/13365_base/bin/python3" -I -c "import numba, llvmlite, numpy, vllm; print('base import ok', numba.__version__, llvmlite.__version__, numpy.__version__, vllm.__version__)" || return 1
  echo "base venv: $(find "$V/13365_base" -type f | wc -l) files (authors' staged 13365_base: 31,656 files incl. __pycache__)"
}
